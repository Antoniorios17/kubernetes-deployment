name: Deployment Workflow
run-name: deployment-workflow-${{ github.actor }}-${{ github.run_number }}
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get current AWS cred
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-1    
          role-to-assume: arn:aws:iam::434057724837:role/DeploymentRole
      - name: Verify AWS identity
        run: aws sts get-caller-identity